<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2F3E55" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/lucsch_icon.png" />
    <title>Traffic Light Crossing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Fredoka', sans-serif;
        overflow: hidden;
        background-color: #2F3E55;
      }
      
      .text-stroke {
        text-shadow: 
          -2px -2px 0 #000, 
           2px -2px 0 #000, 
          -2px  2px 0 #000, 
           2px  2px 0 #000,
          -2px  0   0 #000,
           2px  0   0 #000,
           0   -2px 0 #000,
           0    2px 0 #000;
      }

      .text-stroke-lg {
        text-shadow: 
          -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000,
          -3px 0 0 #000, 3px 0 0 #000, 0 -3px 0 #000, 0 3px 0 #000,
          -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
      }

      .shadow-hard {
        box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
      }
      .shadow-hard-lg {
        box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
      }
      .active-press:active {
        box-shadow: 0px 0px 0px 0px rgba(0,0,0,1);
        transform: translate(4px, 4px);
      }

      @keyframes carEnter {
        from { opacity: 0; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-car-enter {
        animation: carEnter 0.2s ease-out forwards;
      }

      @keyframes carCrash {
        0%, 100% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(5deg) scale(1.05); }
      }
      .animate-crash {
        animation: carCrash 0.4s ease-in-out;
      }

      @keyframes trafficLight {
        0%, 49% { opacity: 0.3; }
        50%, 100% { opacity: 1; }
      }
      .animate-traffic-light {
        animation: trafficLight 0.6s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
